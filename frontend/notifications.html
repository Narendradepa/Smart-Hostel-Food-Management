<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications · Smart Hostel Food</title>
    <link rel="stylesheet" href="style.css?v=541bb40">
    <script src="app.js"></script>
</head>
<body>
    <header><div class="brand">SMART HOSTEL · STUDENT PORTAL</div></header>
    <main>
        <section class="panel">
            <p class="eyebrow">Service updates</p>
            <h1>Notifications</h1>
            <div id="notifications" class="list" aria-live="polite"><div class="empty">Loading notifications…</div></div>
        </section>
        <div class="toolbar"><a class="button secondary" href="student-dashboard.html">Back to dashboard</a></div>
    </main>
    <script>
        (async () => {
            const list = document.getElementById("notifications");
            try {
                const result = await hostelApp.request("/api/notifications/" + encodeURIComponent(hostelApp.studentId()));
                list.replaceChildren();
                if (!result.notifications.length) {
                    list.append(hostelApp.element("div", "empty", "No updates yet. Your food requests and submissions will appear here."));
                    return;
                }
                result.notifications.forEach((notification) => {
                    const item = hostelApp.element("article", "record");
                    item.append(hostelApp.element("p", "", notification.message));
                    item.append(hostelApp.element("small", "", new Date(notification.created_at + "Z").toLocaleString()));
                    list.append(item);
                });
            } catch (error) { list.replaceChildren(hostelApp.element("div", "empty", error.message)); }
        })();
    </script>
</body>
</html>
