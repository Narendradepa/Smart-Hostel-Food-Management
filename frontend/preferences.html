<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food preferences · Smart Hostel Food</title>
    <link rel="stylesheet" href="style.css?v=541bb40">
    <script src="app.js"></script>
</head>
<body>
    <header><div class="brand">SMART HOSTEL · STUDENT PORTAL</div></header>
    <main>
        <section class="panel">
            <p class="eyebrow">Personalize your meals</p>
            <h1>Food preferences</h1>
            <p>Choose the option that best describes your usual meals. You can change it any time.</p>
            <form id="preferencesForm">
                <fieldset>
                    <legend>Diet</legend>
                    <div class="choice"><input type="radio" id="vegetarian" name="diet" value="vegetarian" checked><label for="vegetarian">Vegetarian</label></div>
                    <div class="choice"><input type="radio" id="nonVegetarian" name="diet" value="non_vegetarian"><label for="nonVegetarian">Non-vegetarian</label></div>
                </fieldset>
                <div class="choice"><input type="checkbox" id="lessSpicy"><label for="lessSpicy">Prefer less spicy food</label></div>
                <button id="saveButton">Save preferences</button>
            </form>
            <p id="statusMessage" class="notice" role="status" aria-live="polite"></p>
        </section>
        <div class="toolbar"><a class="button secondary" href="student-dashboard.html">Back to dashboard</a></div>
    </main>
    <script>
        const form = document.getElementById("preferencesForm");
        const studentId = hostelApp.studentId();
        (async () => {
            try {
                const { preferences } = await hostelApp.request("/api/preferences/" + encodeURIComponent(studentId));
                document.querySelector('input[name="diet"][value="' + preferences.diet + '"]').checked = true;
                document.getElementById("lessSpicy").checked = Boolean(preferences.less_spicy);
            } catch (error) { hostelApp.showMessage(document.getElementById("statusMessage"), error.message, false); }
        })();
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("saveButton");
            button.disabled = true;
            try {
                const result = await hostelApp.request("/api/preferences", {
                    method: "POST",
                    body: JSON.stringify({
                        studentId,
                        diet: form.elements.diet.value,
                        lessSpicy: document.getElementById("lessSpicy").checked
                    })
                });
                hostelApp.showMessage(document.getElementById("statusMessage"), result.message);
            } catch (error) { hostelApp.showMessage(document.getElementById("statusMessage"), error.message, false); }
            finally { button.disabled = false; }
        });
    </script>
</body>
</html>
