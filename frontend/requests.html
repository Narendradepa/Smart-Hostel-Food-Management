<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food request · Smart Hostel Food</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <header><div class="brand">SMART HOSTEL · STUDENT PORTAL</div></header>
    <main>
        <section class="panel">
            <p class="eyebrow">Talk to the kitchen</p>
            <h1>Food request</h1>
            <p>Ask for a meal or serving. The food team can update your request status.</p>
            <form id="foodRequestForm">
                <div><label for="foodItem">Food item</label><input id="foodItem" name="foodItem" maxlength="100" required placeholder="For example, extra chapati"></div>
                <div><label for="quantity">Quantity (servings)</label><input id="quantity" name="quantity" type="number" min="1" max="100" step="1" value="1" required></div>
                <div><label for="notes">Notes (optional)</label><textarea id="notes" name="notes" maxlength="500" placeholder="Add a short instruction"></textarea></div>
                <button type="submit" id="submitButton">Submit request</button>
            </form>
            <p id="statusMessage" class="notice" role="status" aria-live="polite"></p>
        </section>
        <div class="toolbar"><a class="button secondary" href="student-dashboard.html">Dashboard</a><a class="button secondary" href="notifications.html">My notifications</a></div>
    </main>
    <footer>Requests use a random ID stored in this browser; don't include private health or identity details in notes.</footer>
    <script>
        document.getElementById("foodRequestForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("submitButton");
            button.disabled = true;
            try {
                const body = {
                    foodItem: document.getElementById("foodItem").value,
                    quantity: Number(document.getElementById("quantity").value),
                    notes: document.getElementById("notes").value,
                    studentId: hostelApp.studentId()
                };
                const result = await hostelApp.request("/api/requests/submit", { method: "POST", body: JSON.stringify(body) });
                hostelApp.showMessage(document.getElementById("statusMessage"), result.message);
                event.currentTarget.reset();
                document.getElementById("quantity").value = "1";
            } catch (error) {
                hostelApp.showMessage(document.getElementById("statusMessage"), error.message, false);
            } finally { button.disabled = false; }
        });
    </script>
</body>
</html>
