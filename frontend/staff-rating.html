<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff rating · Smart Hostel Food</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <header><div class="brand">SMART HOSTEL · STUDENT PORTAL</div></header>
    <main>
        <section class="panel">
            <p class="eyebrow">Rate the service</p>
            <h1>Staff rating</h1>
            <form id="ratingForm">
                <div><label for="rating">Your rating</label>
                    <select id="rating" required>
                        <option value="5">5 · Excellent</option><option value="4">4 · Very good</option>
                        <option value="3">3 · Good</option><option value="2">2 · Could improve</option><option value="1">1 · Poor</option>
                    </select>
                </div>
                <div><label for="comment">Comment (optional)</label><textarea id="comment" maxlength="500" placeholder="Add a short comment"></textarea></div>
                <button id="submitButton">Submit rating</button>
            </form>
            <p id="statusMessage" class="notice" role="status" aria-live="polite"></p>
        </section>
        <div class="toolbar"><a class="button secondary" href="student-dashboard.html">Back to dashboard</a></div>
    </main>
    <script>
        document.getElementById("ratingForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("submitButton");
            button.disabled = true;
            try {
                const result = await hostelApp.request("/api/ratings/submit", {
                    method: "POST",
                    body: JSON.stringify({
                        studentId: hostelApp.studentId(),
                        rating: Number(document.getElementById("rating").value),
                        comment: document.getElementById("comment").value
                    })
                });
                hostelApp.showMessage(document.getElementById("statusMessage"), result.message);
                event.currentTarget.reset();
            } catch (error) { hostelApp.showMessage(document.getElementById("statusMessage"), error.message, false); }
            finally { button.disabled = false; }
        });
    </script>
</body>
</html>
