<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Today's menu · Smart Hostel Food</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <header><div class="brand">SMART HOSTEL · TODAY'S MENU</div></header>
    <main>
        <section class="panel">
            <p class="eyebrow" id="menuDate">Loading today's menu</p>
            <h1>Meals for today</h1>
            <div class="card-grid" id="menuCards"><div class="empty">Loading menu…</div></div>
            <p id="menuMessage" class="notice" role="status" aria-live="polite"></p>
        </section>
        <div class="toolbar">
            <a class="button" href="requests.html">Make a food request</a>
            <a class="button secondary" href="student-dashboard.html">Dashboard</a>
        </div>
    </main>
    <script>
        (async () => {
            const cards = document.getElementById("menuCards");
            try {
                const { menu } = await hostelApp.request("/api/menu");
                cards.replaceChildren();
                [["Breakfast", menu.breakfast], ["Lunch", menu.lunch], ["Dinner", menu.dinner]].forEach(([meal, food]) => {
                    const card = hostelApp.element("article", "card");
                    card.append(hostelApp.element("h3", "", meal), hostelApp.element("p", "", food));
                    cards.append(card);
                });
                document.getElementById("menuDate").textContent = `Menu for ${menu.menu_date}`;
            } catch (error) {
                cards.replaceChildren(hostelApp.element("div", "empty", error.message));
            }
        })();
    </script>
</body>
</html>
