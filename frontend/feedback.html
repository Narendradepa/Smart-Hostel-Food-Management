<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food feedback · Smart Hostel Food</title>
    <link rel="stylesheet" href="style.css?v=541bb40">
    <script src="app.js"></script>
</head>
<body>
    <header><div class="brand">SMART HOSTEL · STUDENT PORTAL</div></header>
    <main>
        <section class="panel">
            <p class="eyebrow">Help us improve</p>
            <h1>Food feedback</h1>
            <p>Send a suggestion or tell us what is working well.</p>
            <form id="feedbackForm">
                <div><label for="message">Your feedback</label><textarea id="message" maxlength="2000" required placeholder="Write your feedback"></textarea></div>
                <button id="submitButton">Send feedback</button>
            </form>
            <p id="statusMessage" class="notice" role="status" aria-live="polite"></p>
        </section>
        <div class="toolbar"><a class="button secondary" href="student-dashboard.html">Back to dashboard</a></div>
    </main>
    <script>
        document.getElementById("feedbackForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const button = document.getElementById("submitButton");
            button.disabled = true;
            try {
                const result = await hostelApp.request("/api/feedback/submit", {
                    method: "POST",
                    body: JSON.stringify({ studentId: hostelApp.studentId(), message: document.getElementById("message").value })
                });
                hostelApp.showMessage(document.getElementById("statusMessage"), result.message);
                form.reset();
            } catch (error) { hostelApp.showMessage(document.getElementById("statusMessage"), error.message, false); }
            finally { button.disabled = false; }
        });
    </script>
</body>
</html>
