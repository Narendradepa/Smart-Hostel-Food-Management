
name: Deploy Smart Hostel Food Management

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      storage_backend:
        description: Database backend for the EC2 application (create the DynamoDB stack first)
        required: true
        type: choice
        options:
          - sqlite
          - dynamodb
        default: sqlite

permissions:
  contents: read

concurrency:
  group: smart-hostel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, archive frontend in S3, and deploy through SSM
    runs-on: ubuntu-latest
    env:
      HOSTEL_STORAGE_BACKEND: ${{ github.event.inputs.storage_backend || 'sqlite' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Assume the project deployment role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::375255020830:role/SmartHostelGitHubDeployRole
          aws-region: us-east-1
          role-session-name: hostel-deploy-${{ github.run_id }}

      - name: Store private frontend copy in S3
        run: >-
          aws s3 sync frontend/
          s3://smart-hostel-food-management-2026m/frontend/
          --no-progress

      - name: Deploy to the EC2 instance with Systems Manager
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ssm-command.json" <<'JSON'
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["i-00684a0067bf2306f"],
            "Comment": "Smart Hostel deployment ${{ github.sha }}",
            "TimeoutSeconds": 600,
            "Parameters": {
              "commands": [
                "set -e",
                "cd /home/ec2-user/Smart-Hostel-Food-Management && git -c safe.directory=/home/ec2-user/Smart-Hostel-Food-Management pull --ff-only origin main",
                "web_root=$(sudo nginx -T 2>/dev/null | awk '$1 == \"root\" {gsub(/;/, \"\", $2); print $2; exit}'); if [ -z \"$web_root\" ] || [ ! -d \"$web_root\" ]; then echo 'Could not find the Nginx document root' >&2; exit 1; fi; if [ \"$web_root\" != \"/home/ec2-user/Smart-Hostel-Food-Management/frontend\" ]; then sudo cp -a /home/ec2-user/Smart-Hostel-Food-Management/frontend/. \"$web_root\"/; fi",
                "npm ci --prefix /home/ec2-user/Smart-Hostel-Food-Management/backend",
                "sudo install -d -m 0755 /etc/systemd/system/hostel-food.service.d",
                "case '${{ env.HOSTEL_STORAGE_BACKEND }}' in dynamodb) printf '%s\\n' '[Service]' 'Environment=HOSTEL_STORAGE=dynamodb' 'Environment=AWS_REGION=us-east-1' 'Environment=DYNAMODB_TABLE_PREFIX=SmartHostelFoodManagement-' | sudo tee /etc/systemd/system/hostel-food.service.d/50-smart-hostel-dynamodb.conf >/dev/null ;; sqlite) printf '%s\\n' '[Service]' 'Environment=HOSTEL_STORAGE=sqlite' 'Environment=AWS_REGION=us-east-1' | sudo tee /etc/systemd/system/hostel-food.service.d/50-smart-hostel-dynamodb.conf >/dev/null ;; *) echo 'Unsupported storage backend' >&2; exit 2 ;; esac",
                "sudo systemctl daemon-reload",
                "sudo systemctl restart hostel-food && sudo systemctl is-active --quiet hostel-food"
              ]
            }
          }
          JSON

          command_id=$(aws ssm send-command \
            --cli-input-json "file://$RUNNER_TEMP/ssm-command.json" \
            --query 'Command.CommandId' \
            --output text)

          if aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id i-00684a0067bf2306f; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-00684a0067bf2306f \
              --query StandardOutputContent \
              --output text
          else
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-00684a0067bf2306f \
              --query StandardErrorContent \
              --output text
            exit 1
          fi
